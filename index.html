<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return originalFetch;
              },
              set: function (newFetch) {
                if (typeof newFetch === 'function') {
                  originalFetch = newFetch;
                }
              },
            });
          }
        } catch (_err) {
          // Ignore if non-configurable in strict sandbox
        }

        window.addEventListener(
          'error',
          function (event) {
            if (
              (event.filename && event.filename.indexOf('chrome-extension://') === 0) ||
              (event.message && event.message.indexOf('Cannot set property fetch') !== -1)
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
    <title>SHARK SET - Agendamento & Campeonatos de Areia</title>
